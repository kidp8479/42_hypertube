name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Doc drift (HYP-70): deterministic checks over the tracked files, no
  # dependency to install. A required check of `main`.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test "scripts/**/*.test.mjs"
      - run: node scripts/check-docs.mjs

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # Real-browser auth-flow coverage (auth flows get a Playwright test).
  # Boots the actual dev stack via docker-compose - same images, same
  # proxy setup - rather than reimplementing it as separate CI services,
  # so this job exercises what a contributor's machine runs too.
  e2e:
    runs-on: ubuntu-latest
    env:
      # Every `docker compose` call below runs the dev stack (ADR-0013); the
      # prod build step names its files itself.
      COMPOSE_FILE: docker-compose.yml:docker-compose.dev.yml
      POSTGRES_USER: hypertube_ci
      POSTGRES_PASSWORD: hypertube_ci_password
      POSTGRES_DB: hypertube_ci
      JWT_SECRET: ci_only_placeholder_jwt_secret_at_least_32_chars_long_0000
      # The backend refuses to boot without its OAuth settings. The e2e suite
      # never goes through a provider, so these are inert placeholders.
      FORTYTWO_CLIENT_ID: ci_placeholder
      FORTYTWO_CLIENT_SECRET: ci_placeholder
      FORTYTWO_CALLBACK_URL: https://localhost:8443/api/auth/42/callback
      GITHUB_CLIENT_ID: ci_placeholder
      GITHUB_CLIENT_SECRET: ci_placeholder
      GITHUB_CALLBACK_URL: https://localhost:8443/api/auth/github/callback
      # Playwright and Bruno run from the same address in one job; the
      # production limits (5 logins a minute, 10 registrations an hour per IP)
      # would answer 429 halfway through.
      THROTTLE_LIMIT_MULTIPLIER: '100'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json
      # Deliberately before the stack starts: frontend/node_modules is a
      # named Docker volume, not a bind mount, so this shouldn't interact
      # with docker-compose either way - but installing on the pristine
      # checkout, before anything else touches the tree, is the simpler
      # thing to reason about.
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      # The Bruno CLI for `make test-api`, from the root lockfile (HYP-120).
      - name: Install root tooling deps
        run: npm ci
      - name: Install Playwright's chromium and firefox
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox
      - name: Start the stack
        run: docker compose up -d --build
      # The proxy answers 502/503/504 while the backend is still booting (and
      # applying its migrations): only an answer from the backend itself counts.
      # GET on the login route is a 404 from Nest once it is up.
      - name: Wait for the backend
        run: |
          for i in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/api/auth/login || true)
            case "$code" in
              000|502|503|504) sleep 2 ;;
              *) exit 0 ;;
            esac
          done
          echo "Backend not up behind the proxy after 60 s - dumping compose logs" >&2
          docker compose logs
          exit 1
      # The stack booted on an empty database, so the migrations just built the
      # whole schema; this fails if an entity changed without a migration.
      - name: Check the migrations match the entities
        run: docker compose exec -T backend npm run migration:check
      - name: Run the e2e suite
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      # Exact HTTP codes, refresh rotation and reuse detection: what the
      # browser suite does not see. Same stack, so no second boot.
      - name: Run the API collection (Bruno)
        run: make test-api BRUNO_ARGS="--reporter-html bruno-report.html"
      - name: Upload the Bruno report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bruno-report
          path: api/bruno/bruno-report.html
          retention-days: 7
      # The prod stages are not what the suites above run (ADR-0013): build
      # them so a Dockerfile change that breaks only prod fails here.
      - name: Build the prod images
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml build backend frontend
      # The SPA's CSP is sent by the prod frontend only (ADR-0014), which the
      # suites above never load: check the built image sends it, on a file and
      # on a client route served by the index.html fallback.
      - name: Check the prod SPA sends its Content-Security-Policy
        run: |
          docker run -d --rm --name spa-csp -p 127.0.0.1:8099:80 hypertube-frontend:prod
          trap 'docker stop spa-csp >/dev/null' EXIT
          for i in $(seq 1 15); do curl -sf -o /dev/null http://127.0.0.1:8099/ && break; sleep 1; done
          for path in / /movies/42; do
            csp=$(curl -sfI "http://127.0.0.1:8099$path" | grep -i '^content-security-policy:' || true)
            echo "$path -> $csp"
            echo "$csp" | grep -q "script-src 'self';" || exit 1
            echo "$csp" | grep -q "frame-ancestors 'none'" || exit 1
          done
      - name: Tear down the stack
        if: always()
        run: docker compose down -v
