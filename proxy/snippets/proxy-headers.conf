# Request headers every proxied location sends upstream. X-Forwarded-For is
# set everywhere on purpose: the backend trusts one hop (ADR-0009) and reads
# the address nginx appended, so a location that forwarded the client's own
# header untouched would let it pick the address the rate limiter sees.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
