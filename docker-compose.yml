# What the dev and prod stacks share (HYP-17, ADR-0013). Never used alone:
#   dev  = this file + docker-compose.dev.yml   (`make up`)
#   prod = this file + docker-compose.prod.yml  (`make up-prod`)
# The dev file adds the dev build targets, the bind-mounted source and the
# node_modules volumes; the prod file builds the prod stages instead.
services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://localhost:${HYPERTUBE_HTTPS_PORT:-8443}}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_EXPIRES_IN: ${REFRESH_EXPIRES_IN:-7d}
      FORTYTWO_CLIENT_ID: ${FORTYTWO_CLIENT_ID}
      FORTYTWO_CLIENT_SECRET: ${FORTYTWO_CLIENT_SECRET}
      FORTYTWO_CALLBACK_URL: ${FORTYTWO_CALLBACK_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      THROTTLE_LIMIT_MULTIPLIER: ${THROTTLE_LIMIT_MULTIPLIER:-1}
    volumes:
      # Uploaded profile pictures (HYP-38, ADR-0016): outside the source tree
      # and outside anything nginx serves; only the backend reads them.
      - pictures:/var/lib/hypertube/pictures
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    restart: unless-stopped

  # Edge proxy (HYP-71): TLS, routing and edge headers in front of the two
  # services above. Only the host-side ports are configurable; inside, nginx
  # listens on 8080 (redirect) and 8443 (TLS).
  proxy:
    build:
      context: ./proxy
    environment:
      # Where the HTTP -> HTTPS redirect sends the browser: this name and the
      # port published below. Never taken from the Host header.
      PROXY_SERVER_NAME: ${PROXY_SERVER_NAME:-localhost}
      PROXY_PUBLIC_HTTPS_PORT: ${HYPERTUBE_HTTPS_PORT:-8443}
      # 0 = no HSTS. Set it only for a real deployment: HSTS is per host name,
      # so on localhost it would force HTTPS onto every other local port.
      PROXY_HSTS_MAX_AGE: ${PROXY_HSTS_MAX_AGE:-0}
      # Where the SPA is served from: nginx with the built files (prod), which
      # the dev file switches to the Vite dev server.
      PROXY_FRONTEND_UPSTREAM: frontend:80
    ports:
      - "127.0.0.1:${HYPERTUBE_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${HYPERTUBE_HTTPS_PORT:-8443}:8443"
    volumes:
      # The certificate lives here: mount a real tls.crt / tls.key to replace
      # the self-signed one.
      - proxy_certs:/etc/nginx/certs
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  db_data:
  pictures:
  proxy_certs:
