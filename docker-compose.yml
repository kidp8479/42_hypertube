# NOTE: this compose file targets `dev` (hot-reload, bind-mounted source)
# for all services. A prod-targeted variant (or override file, see
# Transcendence's ops/compose/dev.yml pattern) is still needed before
# submission/defense - see HYP-17.
services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://localhost:${HYPERTUBE_HTTPS_PORT:-8443}}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      FORTYTWO_CLIENT_ID: ${FORTYTWO_CLIENT_ID}
      FORTYTWO_CLIENT_SECRET: ${FORTYTWO_CLIENT_SECRET}
      FORTYTWO_CALLBACK_URL: ${FORTYTWO_CALLBACK_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      THROTTLE_LIMIT_MULTIPLIER: ${THROTTLE_LIMIT_MULTIPLIER:-1}
    volumes:
      - ./backend:/app
      # Everything the container writes lives in named volumes, never on the
      # bind-mounted source. Compose runtimes disagree on bind-mount
      # ownership: Docker maps the container "node" user (UID 1000) to the
      # host user, but rootless Podman (school) maps the host user to
      # container root, leaving "node" unable to write into /app. Named
      # volumes are chowned to the image user by both, so tsc/nest can
      # always write dist/ and its .tsbuildinfo. (nest-cli.json keeps
      # deleteOutDir:false because /app/dist is a mount point here and
      # can't be rmdir'd - the prod build stage has a plain dir.)
      - backend_node_modules:/app/node_modules
      - backend_dist:/app/dist
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      # The Vite dev proxy runs inside this container, where the backend is
      # the `backend` service, not localhost (that default is for host dev).
      VITE_API_PROXY_TARGET: http://backend:3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  # Edge proxy (HYP-71): TLS, routing and edge headers in front of the two
  # services above. Only the host-side ports are configurable; inside, nginx
  # listens on 8080 (redirect) and 8443 (TLS).
  proxy:
    build:
      context: ./proxy
    environment:
      # Where the HTTP -> HTTPS redirect sends the browser: this name and the
      # port published below. Never taken from the Host header.
      PROXY_SERVER_NAME: ${PROXY_SERVER_NAME:-localhost}
      PROXY_PUBLIC_HTTPS_PORT: ${HYPERTUBE_HTTPS_PORT:-8443}
      # 0 = no HSTS. Set it only for a real deployment: HSTS is per host name,
      # so on localhost it would force HTTPS onto every other local port.
      PROXY_HSTS_MAX_AGE: ${PROXY_HSTS_MAX_AGE:-0}
    ports:
      - "127.0.0.1:${HYPERTUBE_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${HYPERTUBE_HTTPS_PORT:-8443}:8443"
    volumes:
      # The certificate lives here: mount a real tls.crt / tls.key to replace
      # the self-signed one.
      - proxy_certs:/etc/nginx/certs
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  db_data:
  proxy_certs:
  backend_node_modules:
  backend_dist:
  frontend_node_modules:
