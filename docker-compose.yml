# NOTE: this compose file targets `dev` (hot-reload, bind-mounted source)
# for all services. A prod-targeted variant (or override file, see
# Transcendence's ops/compose/dev.yml pattern) is still needed before
# submission/defense - see HYP-17.
services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend:/app
      # Everything the container writes lives in named volumes, never on the
      # bind-mounted source. Compose runtimes disagree on bind-mount
      # ownership: Docker maps the container "node" user (UID 1000) to the
      # host user, but rootless Podman (school) maps the host user to
      # container root, leaving "node" unable to write into /app. Named
      # volumes are chowned to the image user by both, so tsc/nest can
      # always write dist/ and its .tsbuildinfo. (nest-cli.json keeps
      # deleteOutDir:false because /app/dist is a mount point here and
      # can't be rmdir'd - the prod build stage has a plain dir.)
      - backend_node_modules:/app/node_modules
      - backend_dist:/app/dist
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  db_data:
  backend_node_modules:
  backend_dist:
  frontend_node_modules:
