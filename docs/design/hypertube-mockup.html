<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hypertube design mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* HYPERTUBE, final design (HYP-66): connexion, inscription, bibliotheque, with their states.
   One token set from the user's reference: dark green-grey, 1px monoline, off-white structure,
   orange = a flow in progress, mint for secondary patterns, rose-red for errors only.
   Single dark look on purpose, so no light theme here. */
:root {
  color-scheme: dark;
  --bg: #171a1b;
  --surface: #1f2324;
  --line: #3b4446;      /* decorative separators only (1.8:1): never the edge of a control */
  --edge: #6b7577;      /* functional borders: inputs, chips, idle badges (3.7:1 on bg, 3.35:1 on surface) */
  --ink: #ece9e1;       /* 14.4:1 */
  --muted: #9ba4a2;     /* 6.9:1 */
  --orange: #e8873a;    /* 6.6:1. One meaning only: a flow in progress (transfer wave, active downloads) */
  --mint: #7fc79a;      /* 8.8:1, secondary patterns */
  --alert: #ff6b81;     /* errors only (6.4:1), never an accent */
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 15px/1.5 var(--sans);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.label { font: 500 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* ----- prototype chrome, deliberately not part of the design ----- */
.proto { max-width: 1120px; margin: 0 auto; padding-block: 14px 48px; }
.pages { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.pages button { font: 500 13px var(--mono); padding: 10px 16px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; }
.pages button:hover { color: var(--ink); }
.pages button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
.proto-note { font: 400 12px/1.5 var(--mono); color: var(--muted); padding-bottom: 12px; border-bottom: 1px dashed var(--line); margin-bottom: 22px; display: grid; gap: 4px; }
.screens { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.screens button { font: 500 12px var(--mono); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; color: var(--muted); }
.screens button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

/* ----- shared pieces ----- */
.badge { display: inline-grid; place-items: center; width: 24px; height: 24px; flex: none; border-radius: 50%; border: 1px solid var(--ink); font: 500 10px var(--mono); background: transparent; color: var(--ink); cursor: pointer; padding: 0; }
.badge.on { border-color: var(--ink); color: var(--ink); }   /* watched */
.badge.cur { background: var(--ink); border-color: var(--ink); color: var(--bg); }   /* current page, language */
.badge.dim { border-color: var(--edge); color: var(--muted); }
button.badge, .badge.lg { width: 32px; height: 32px; font-size: 12px; }
.dots { background-image: radial-gradient(circle, var(--ink) 0.8px, transparent 1.1px); background-size: 9px 9px; opacity: .55; }
.dots.fine { background-size: 6px 6px; opacity: .35; }
.dots.mint { background-image: radial-gradient(circle, var(--mint) 0.9px, transparent 1.2px); }
.rule { height: 1px; background: var(--line); border: 0; margin: 0; }
.poster { position: relative; aspect-ratio: 2 / 3; border-radius: 2px; overflow: hidden; }
.poster svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .28; }
.field { display: grid; gap: 6px; align-content: start; }
.field input { background: transparent; border: 1px solid var(--edge); border-radius: 0; padding: 10px 12px; width: 100%; color: var(--ink); }
.field input::placeholder { color: var(--muted); opacity: 1; }
.field input:focus { border-color: var(--ink); }
.btn { border: 1px solid var(--ink); background: transparent; color: var(--ink); padding: 10px 14px; cursor: pointer; font: 500 13px var(--mono); letter-spacing: .04em; text-align: center; }
.btn.go { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.btn.go:hover { background: #f6f3ec; }
.btn:hover { background: rgba(236,233,225,.08); }
.alert { display: flex; gap: 10px; align-items: center; border: 1px solid var(--alert); padding: 8px 10px; color: var(--ink); font-size: 13px; }
.alert .badge { width: 20px; height: 20px; cursor: default; border-color: var(--alert); color: var(--alert); }
.alert a { color: var(--ink); text-underline-offset: 3px; }
.skel { background-image: radial-gradient(circle, var(--ink) 1px, transparent 1.3px); background-size: 8px 8px; opacity: .35; }
@media (prefers-reduced-motion: no-preference) { .skel { animation: pulse 1.6s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .65; } }
.rate { display: flex; align-items: center; gap: 8px; font: 500 12px var(--mono); }
.rate i { position: relative; flex: 1; height: 1px; background: var(--line); }
.rate i b { position: absolute; top: -4px; width: 1px; height: 9px; background: var(--ink); }

/* ----- Variant A: Panneau (modular instrument grid) ----- */
.A { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.amain { display: contents; }
.A > *, .A > .amain > * { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 14px; min-width: 0; }
.A .span2 { grid-column: span 2; } .A .span4 { grid-column: span 4; }
.A .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.A .mark { font: 500 13px var(--mono); letter-spacing: .24em; }
.brand { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; min-width: 0; }
.logo { flex: none; display: block; }
.pmap { position: absolute; inset: 0; width: 100%; height: 100%; }
.lockup { position: relative; display: grid; gap: 8px; justify-items: center; background: var(--bg); padding: 12px 16px; }
.lockup .mark { color: var(--ink); }
.fgrid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
@media (max-width: 480px) { .fgrid2 { grid-template-columns: 1fr; } }
.inwrap { position: relative; }
.inwrap input.pw { padding-right: 64px; }
.showpw { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); min-height: 28px; padding: 0 10px; background: none; border: 0; color: var(--muted); font: 500 12px var(--mono); cursor: pointer; }
.showpw:hover { color: var(--ink); }
.hint { font: 400 12px var(--mono); color: var(--muted); }
.cap { font: 400 12px var(--mono); color: var(--muted); }
.cform textarea::placeholder { color: var(--muted); opacity: 1; }
.ferr { display: flex; gap: 6px; align-items: flex-start; color: var(--alert); font-size: 13px; }
.ferr svg { flex: none; width: 12px; height: 12px; margin-top: 4px; fill: none; stroke: currentColor; stroke-width: 1.2; }
.field input[aria-invalid="true"] { border-color: var(--alert); }
.notice { display: flex; gap: 10px; align-items: center; border: 1px solid var(--mint); padding: 8px 10px; font-size: 13px; margin-bottom: 14px; }
.notice .badge { width: 20px; height: 20px; cursor: default; border-color: var(--mint); color: var(--mint); }
.decoart { position: absolute; inset: 0; display: grid; place-items: center; }
.legend { position: absolute; left: 10px; bottom: 10px; background: var(--bg); padding: 5px 10px; display: flex; flex-wrap: wrap; gap: 4px 16px; font: 500 12px var(--mono); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.legend .h { background: var(--mint); }
.legend .t { background: var(--orange); }
.legend .m { background: var(--ink); opacity: .35; }
.tagline { font: 400 12px var(--mono); color: var(--muted); letter-spacing: .04em; }
.A .ltitle { font: 500 24px/1.2 var(--sans); margin: 0 0 14px; }
.A .xfer { display: grid; gap: 10px; padding-block: 12px; }
.xrow { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; align-items: center; }
.xrow .xl { display: flex; align-items: center; gap: 6px; font: 500 12px var(--mono); color: var(--muted); }
.xrow .xl svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.2; flex: none; }
.wavebox { position: relative; overflow: hidden; min-width: 0; }
.wv { will-change: transform; }
@media (prefers-reduced-motion: no-preference) { .wv { animation: slide linear infinite; } }
@keyframes slide { to { transform: translateX(-240px); } }
.A form { display: grid; gap: 12px; }
.A .deco { display: grid; place-items: center; min-height: 300px; position: relative; overflow: hidden; }
.A .deco .dots { position: absolute; inset: 14px; }
.A .deco svg { position: relative; }
@media (max-width: 760px) { .A { grid-template-columns: repeat(2, minmax(0, 1fr)); } .A .span2, .A .span4 { grid-column: span 2; } }

/* ----- Variant C: Console (rail + big posters + status line) ----- */
.C { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 0; border: 1px solid var(--line); height: calc(100dvh - 240px); min-height: 560px; }
.C .rail { border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 14px 0; }
.C .rnav { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.lab { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.C .toplang { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.chead { min-width: 0; }
.fpanel { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-end; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.fgroup { display: grid; gap: 6px; }
a.tile { color: inherit; text-decoration: none; }
a.tile:hover b { text-decoration: underline; text-underline-offset: 3px; }
a.tile:hover .poster, a.tile:focus-visible .poster { outline: 1px solid var(--ink); outline-offset: 3px; }
a.tile:hover .poster::before, a.tile:focus-visible .poster::before, a.tile:hover .poster::after, a.tile:focus-visible .poster::after { width: 16px; height: 16px; }
a.tile:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
.C .tile .meta { display: flex; gap: 8px; align-items: baseline; }
.rt { color: var(--ink); font: 500 15px var(--mono); }
.C .tile small .badge { width: 28px; height: 28px; }
.yr { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .C .poster::before, .C .poster::after { transition: width .15s ease-out, height .15s ease-out; } }
a.badge { text-decoration: none; }
.badge svg { fill: none; stroke: currentColor; stroke-width: 1.2; }
.badge.lg svg { width: 18px; height: 18px; }
.C .top { margin: 0; }
.C .chips { display: flex; gap: 8px; flex-wrap: wrap; }
.C .chip svg { vertical-align: -1px; margin-left: 2px; }
.C .grid:focus-visible { outline-offset: -2px; }
.loadmsg { grid-column: 1 / -1; margin: 0; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); font: 500 13px var(--mono); color: var(--ink); }
.empty { grid-column: 1 / -1; display: grid; gap: 10px; justify-items: start; padding: 40px 6px; max-width: 46ch; }
.empty p { margin: 0; }
.empty .etitle { font: 500 18px/1.3 var(--sans); }
.empty .esub { color: var(--muted); font-size: 14px; }
.links { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; }
.links a { color: var(--ink); text-underline-offset: 3px; display: inline-block; padding-block: 4px; }
.C .rail .mark { writing-mode: vertical-rl; font: 500 12px var(--mono); letter-spacing: .3em; margin-top: auto; color: var(--muted); }
.C .main { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
.C .main.login { grid-template-rows: minmax(0, 1fr) auto; }
.C .top { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.C .top input { flex: 1 1 160px; background: transparent; border: 1px solid var(--edge); padding: 7px 10px; min-width: 0; }
.C .top input::placeholder { color: var(--muted); opacity: 1; }
.C .chip { border: 1px solid var(--edge); border-radius: 999px; min-height: 28px; padding: 4px 12px; font: 500 12px var(--mono); color: var(--muted); background: none; cursor: pointer; }
.C .chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.seg { display: inline-flex; }
.C .seg .chip { border-radius: 0; border-left-width: 0; }
.C .seg .chip:first-child { border-radius: 999px 0 0 999px; border-left-width: 1px; }
.C .seg .chip:last-child { border-radius: 0 999px 999px 0; }
.C .chip.has, .C .chip[aria-expanded="true"], .C .chip.tag { border-color: var(--ink); color: var(--ink); }
.C .grid { overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; padding: 14px; align-content: start; }
.C .tile { position: relative; display: grid; gap: 6px; }
.C .poster::before, .C .poster::after { content: ""; position: absolute; width: 10px; height: 10px; z-index: 1; border: 1px solid var(--ink); }
.C .poster::before { top: 5px; left: 5px; border-right: 0; border-bottom: 0; }
.C .poster::after { bottom: 5px; right: 5px; border-left: 0; border-top: 0; }
.C .tile b { font: 500 13px var(--sans); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.C .tile small { font: 400 12px var(--mono); color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.C .status { border-top: 1px solid var(--line); padding: 7px 14px; display: flex; justify-content: space-between; gap: 10px; font: 400 12px var(--mono); color: var(--muted); flex-wrap: wrap; }
.C .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
.C .split .art { position: relative; display: grid; place-items: center; border-right: 1px solid var(--line); overflow: hidden; }
.C .split .art .dots { position: absolute; inset: 0; }
.C .split .art svg { position: relative; }
.C .split form { padding: 28px; display: grid; gap: 14px; align-content: center; }
@media (max-width: 640px) { .C { height: auto; } .C .split { grid-template-columns: 1fr; } .C .split .art { min-height: 140px; border-right: 0; border-bottom: 1px solid var(--line); } }

.C.lib { grid-template-columns: 56px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
.libhead { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.libhead .mark { font: 500 13px var(--mono); letter-spacing: .24em; }
.libhead .tools { display: flex; align-items: center; gap: 8px; }
.langtxt { display: inline-flex; align-items: center; gap: 4px; font: 500 12px var(--mono); color: var(--muted); }
.langtxt button { background: none; border: 0; padding: 4px 6px; min-height: 28px; color: var(--muted); cursor: pointer; font: inherit; }
.langtxt button:hover { color: var(--ink); }
.langtxt button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 6px; }
.C.lib .rail { padding-top: 14px; }
.C.lib .grid { gap: 0; padding: 0; }
.C.lib .tile { padding: 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); align-content: start; }
.C.lib a.tile:focus-visible { outline-offset: -4px; }
.C.lib .empty { justify-items: center; text-align: center; padding: 48px 14px; max-width: none; margin: auto; gap: 12px; }
.C.lib .grid:has(.empty) { align-content: center; }
.empty .etitle { text-wrap: balance; }
.empty .esub { max-width: 44ch; }
.pstrip { display: flex; flex-wrap: wrap; gap: 3px; }
.pstrip i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); opacity: .28; }
.pstrip i.h { background: var(--mint); opacity: 1; }
.pstrip i.t { background: var(--orange); opacity: 1; }
.dl { font: 500 13px var(--mono); color: var(--orange); }


/* ----- Video page ----- */
@media (max-width: 700px) { .ctls .subs { order: 3; flex-basis: 100%; } }
@media (max-width: 480px) { .libhead, .A .head { flex-wrap: nowrap; } .libhead .brand, .A .head .brand { flex: 1; } .tagline { flex-basis: 100%; } .libhead .tools .label, .A .head .label { display: none; } }
.C.lib { height: auto; min-height: 560px; }
.C.lib .grid { overflow: visible; }
.C.lib .grid:has(.empty) { min-height: 360px; }
.chead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; background: var(--bg); }
.C.lib .status { position: sticky; bottom: 0; background: var(--bg); z-index: 3; }
@media (min-width: 701px) { .C.lib .rail { position: sticky; top: 0; align-self: start; border-right: 0; } .C.lib .main { border-left: 1px solid var(--line); } }
@media (max-width: 700px) { .C.lib .status { position: static; } }
.activef { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.activef .chip svg { margin-left: 4px; }
.C.vid .main { min-height: 0; }
.vmain { display: grid; grid-template-columns: minmax(0, 2fr) minmax(250px, 1fr); grid-template-areas: "title info" "player info" "transfer info" "comments info"; grid-template-rows: auto auto auto 1fr; min-width: 0; }
.vcell { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 14px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.vtitle { grid-area: title; display: flex; gap: 14px; align-items: flex-start; }
.vthumb .poster { width: 96px; }
.vtext { display: grid; gap: 6px; min-width: 0; flex: 1; }
.vtext h1 { font: 500 24px/1.2 var(--sans); margin: 0; }
.vplayer { grid-area: player; } .vtransfer { grid-area: transfer; } .vcomments { grid-area: comments; border-bottom: 0; } .vinfo { grid-area: info; border-right: 0; border-bottom: 0; }
@media (max-width: 900px) { .vmain { grid-template-columns: 1fr; grid-template-areas: "title" "player" "info" "transfer" "comments"; } .vcell { border-right: 0; } .vcomments { border-bottom: 0; } .vinfo { border-bottom: 1px solid var(--line); } }
a.crumb { text-decoration: none; }
.crumb { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--ink); font: 500 13px var(--mono); cursor: pointer; padding: 4px 0; min-height: 28px; }
.crumb svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.2; }
.crumb:hover span { text-decoration: underline; text-underline-offset: 3px; }
.screenarea { position: relative; aspect-ratio: 16 / 9; display: grid; place-items: center; border: 1px solid var(--line); overflow: hidden; }
.screenarea svg.still { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .22; }
.screenarea .overlay { position: relative; display: grid; gap: 10px; justify-items: center; text-align: center; padding: 14px; max-width: 46ch; background: rgba(23,26,27,.82); border: 1px solid var(--line); }
.screenarea .overlay p { margin: 0; }
.screenarea .tag { position: absolute; left: 10px; top: 10px; background: rgba(23,26,27,.82); border: 1px solid var(--edge); padding: 2px 8px; font: 500 12px var(--mono); }
.bigplay { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--ink); background: rgba(23,26,27,.6); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
.bigplay svg, .ctl svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.2; }
.ctls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.ctl { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--ink); background: none; color: var(--ink); display: inline-grid; place-items: center; cursor: pointer; padding: 0; }
.ctl[aria-disabled="true"] { border-color: var(--edge); color: var(--muted); cursor: not-allowed; }
.time { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
.time.dim { color: var(--muted); }
.ctls .grow { flex: 1; }
.subs { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tlwrap { position: relative; height: 24px; display: flex; align-items: center; }
.tlwrap .tl { flex: 1; }
.seek { position: absolute; inset: 0; width: 100%; height: 24px; margin: 0; opacity: 0; cursor: pointer; z-index: 2; }
.seek:disabled { cursor: not-allowed; }
.seek:focus-visible ~ .tl { outline: 2px solid var(--ink); outline-offset: 4px; }
.tl { position: relative; display: flex; gap: 1px; height: 12px; }
.tl i { flex: 1; background: var(--ink); opacity: .22; }
.tl i.h { background: var(--mint); opacity: 1; } .tl i.t { background: var(--orange); opacity: 1; }
.tl .thr { position: absolute; top: -3px; width: 1px; height: 18px; background: var(--ink); opacity: .7; pointer-events: none; }
.tl .head { position: absolute; top: -4px; width: 2px; height: 20px; background: var(--ink); pointer-events: none; }
.tl .head::after { content: ""; position: absolute; left: -3px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.tlnote { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font: 400 12px var(--mono); color: var(--muted); margin-top: 6px; }
.pmapgrid { display: grid; grid-template-columns: repeat(24, 1fr); gap: 4px; }
.pmapgrid i { aspect-ratio: 1; border-radius: 50%; background: var(--ink); opacity: .28; }

    else if (act === 'rmf') { if (v === 'fg') { fGenre = 'All'; } else if (v === 'fr') { fRating = 'Any'; } else { fYear = 'Any'; } }
    else if (act === 'clearf') { fGenre = 'All'; fRating = 'Any'; fYear = 'Any'; }
    focusKey = t.getAttribute('data-key'); draw();
  });
  function fmt(sec) { var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), x = sec % 60; return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); }
  stage.addEventListener('input', function (e) {
    var r = e.target.closest('input.seek'); if (!r) { return; }
    var max = Number(r.max), limit = Math.floor(Number(r.getAttribute('data-front')) / 100 * max);
    if (Number(r.value) > limit) { r.value = limit; }
    var v = Number(r.value), head = stage.querySelector('.tl .head'), t = stage.querySelector('.time');
    if (head) { head.style.left = (v / max * 100).toFixed(2) + '%'; }
    if (t) { t.textContent = fmt(v) + ' / 02:33:00'; }
    r.setAttribute('aria-valuetext', fmt(v));
  });
  stage.addEventListener('submit', function (e) {
    var f = e.target.closest('form.cform'); if (!f) { return; }
    e.preventDefault();
    var v = f.querySelector('textarea').value.trim();
    if (!v) { cErr = true; focusKey = 'cmt'; draw(); var ta = document.getElementById('cmt'); if (ta) { ta.focus(); } return; }
    cErr = false; comments.unshift({ u: 'you', own: true, t: 'just now', x: v }); draw();
  });
  var rz = null;
  window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { drawWaves(); fillGrid(); drawVideoWaves(); drawPmap(); }, 120); });
  draw();
})();
