server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy of the built SPA (ADR-0014). Prod only: the dev
    # page Vite serves has an inline react-refresh script and injects its CSS
    # as <style> tags, which this policy would block. The build has neither:
    # one script file, one stylesheet, fonts bundled. Images allow any https
    # host because profile pictures are links to any host (HYP-87). The edge
    # proxy adds HSTS, nosniff and X-Frame-Options on top. Kept at server
    # level: an add_header inside a location would drop this one there.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # SPA fallback: any unknown path serves index.html so client-side
    # routing (React Router or similar) handles it, instead of nginx
    # returning a 404 on a direct hit to e.g. /movies/42.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
